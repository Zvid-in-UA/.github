name: Build, push and deploy

on:
  workflow_call:
    inputs:
      registry:
        description: The registry host the image is pushed to.
        type: string
        required: true
      image:
        description: The image's name in the registry.
        type: string
        required: true
      title:
        description: The image's `org.opencontainers.image.title` label.
        type: string
        required: true
      description:
        description: The image's `org.opencontainers.image.description` label.
        type: string
        required: true
      build-args:
        description: Build args, one `NAME=value` per line.
        type: string
        default: ''
    secrets:
      registry-username:
        required: true
      registry-password:
        required: true
      deploy-hooks:
        description: The deploy webhook URLs, one per line, called in order.
        required: true

jobs:
  build-push-deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      contents: read

    env:
      IMAGE: ${{ inputs.registry }}/${{ inputs.image }}
      REGISTRY_USERNAME: ${{ secrets.registry-username }}
      REGISTRY_PASSWORD: ${{ secrets.registry-password }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ inputs.title }}
            org.opencontainers.image.description=${{ inputs.description }}
            org.opencontainers.image.vendor=Zvid
            org.opencontainers.image.licenses=UNLICENSED

      - name: Retag latest as prev
        run: |
          skopeo copy \
            --src-creds "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
            --dest-creds "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
            "docker://$IMAGE:latest" \
            "docker://$IMAGE:prev" \
            || echo "No latest yet, so no prev"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Purge old tags
        env:
          REPOSITORY: https://${{ inputs.registry }}/v2/${{ inputs.image }}
        run: |
          TAGS=$(curl -fsSu "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" "$REPOSITORY/tags/list" | jq -r '.tags[]')

          for TAG in $TAGS; do
            if [ "$TAG" = "latest" ] || [ "$TAG" = "prev" ]; then continue; fi
            DIGEST=$(curl -fsSI \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              -u "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
              "$REPOSITORY/manifests/$TAG" \
              | grep -i docker-content-digest | awk '{print $2}' | tr -d $'\r')
            curl -fsS -X DELETE -u "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" "$REPOSITORY/manifests/$DIGEST" \
              && echo "Deleted tag $TAG ($DIGEST)" || echo "Failed to delete $TAG"
          done

      - name: Trigger deployments
        env:
          DEPLOY_HOOKS: ${{ secrets.deploy-hooks }}
        run: |
          while IFS= read -r HOOK; do
            if [ -z "$HOOK" ]; then continue; fi
            curl -fsSL -o /dev/null "$HOOK"
          done <<< "$DEPLOY_HOOKS"
